name: Keep Render Backend Awake

on:
  schedule:
    # Render 免费套餐空闲 ~15 分钟自动休眠 → 下次请求 503/429 直到服务唤醒
    # 每 10 分钟探活（仓库 public → GitHub Actions 零成本无限分钟）
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    name: HTTP keep-alive
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping claw-api health + engine
        env:
          API_BASE: https://claw-api-5zq7.onrender.com
        run: |
          echo "::group::HTTP keep-alive ping @ $(date -u +%H:%M:%SZ)"
          for ep in /api/health /api/nar1-import/capability; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 -H "Origin: https://claw-web.onrender.com" "$API_BASE$ep")
            echo "GET $ep -> HTTP=$code"
          done
          echo "::endgroup::"
          # 不 exit 1：边缘 429/503 是 Render 唤醒瞬态；唤醒后下一次自然恢复
          # 真持续失败从日志时间戳 / status code 即可识别，无需失败告警噪声